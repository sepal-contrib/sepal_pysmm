name: sepal_pysmm
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pyproj  # Always include to avoid PROJ conflicts
  - voila
  - earthengine-api<=1.5
  - rasterio<1.3.11
  - gdal=3.8.3
  - pandas
  - dask
  - tqdm
  - natsort
  - pypandoc
  - scikit-learn
  - pip
  - pip:
    # Add packages that must stay as pip installs:
    - sepal_ui==2.20.0  # Use exact version from requirements.txt
